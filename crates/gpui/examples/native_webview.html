<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #fcfcfc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #fcfcfc;
      color: #5c6166;
    }
    main {
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 28px;
      padding: 42px 38px;
    }
    .eyebrow {
      color: #3b9ee5;
      font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    h1 {
      max-width: 360px;
      margin: 14px 0;
      font-size: 34px;
      font-weight: 590;
      letter-spacing: -.035em;
      line-height: 1.06;
    }
    p {
      max-width: 390px;
      margin: 0;
      color: #8b8e92;
      font-size: 14px;
      line-height: 1.6;
    }
    .details { display: grid; gap: 10px; align-content: start; }
    .datum {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #cfd1d2;
      color: #8b8e92;
      font: 11px ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .datum strong { color: #313435; font-weight: 600; }
    input {
      grid-column: 1 / -1;
      width: 100%;
      margin-top: 8px;
      padding: 13px 14px;
      border: 1px solid #cfd1d2;
      border-radius: 7px;
      outline: none;
      background: #ffffff;
      color: #5c6166;
      font: 13px ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    input:focus {
      border-color: #3b9ee5;
      box-shadow: 0 0 0 3px rgba(59, 158, 229, .13);
    }
  </style>
</head>
<body>
  <main>
    <section>
      <div class="eyebrow">Native surface / live</div>
      <h1>A real browser inside GPUI’s scene.</h1>
      <p>
        This page is rendered by WKWebView. GPUI owns the surfaces
        below and above it, while AppKit composes all three.
      </p>
    </section>
    <aside class="details">
      <div class="datum"><span>ENGINE</span><strong>WEBKIT</strong></div>
      <div class="datum"><span>HOST</span><strong>NSVIEW</strong></div>
      <div class="datum"><span>STATE</span><strong>INTERACTIVE</strong></div>
    </aside>
    <input autofocus value="Focus and type inside the native layer">
  </main>
</body>
</html>
