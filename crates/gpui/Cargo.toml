[package]
name = "gpui"
version = "0.2.2"
edition.workspace = true
authors = ["Nathan Sobo <nathan@zed.dev>"]
description = "Zed's GPU-accelerated UI framework"
repository = "https://github.com/zed-industries/zed"
publish = true
license = "Apache-2.0"
homepage = "https://gpui.rs"
readme = "README.md"
keywords = ["desktop", "gui", "immediate"]
categories = ["gui"]


[lints]
workspace = true

[features]
# The platform bundle: pulls in the backend for the target OS, hosts the
# `application()`, `headless()`, and `current_platform()` entrypoints, and turns
# on the windowing and text features a desktop build needs.
#
# `default-features = false` drops it, leaving a headless gpui with no platform
# dependencies compiled.
default = ["platform"]
platform = [
    "dep:gpui_linux",
    "dep:gpui_macos",
    "dep:gpui_windows",
    "dep:gpui_web",
    "font-kit",
    "wayland",
    "x11",
    "windows-manifest",
]
test-support = [
    "gpui_authoring/test-support",
    "gpui_macos?/test-support",
    "gpui_windows?/test-support",
    "wayland",
    "x11",
]
bench-support = [
    "gpui_authoring/bench-support",
    "gpui_macos?/bench-support",
]
# Preserve the published feature name while consumers migrate to `bench-support`.
bench = ["bench-support"]
inspector = ["gpui_authoring/inspector"]
leak-detection = ["gpui_authoring/leak-detection"]
wayland = ["gpui_platform/wayland", "gpui_linux?/wayland"]
x11 = [
    "scap?/x11",
    "gpui_platform/x11",
    "gpui_linux?/x11",
]
screen-capture = [
    "scap",
    "gpui_platform/screen-capture",
    "gpui_linux?/screen-capture",
    "gpui_macos?/screen-capture",
    "gpui_windows?/screen-capture",
]
windows-manifest = ["dep:embed-resource"]
profiler = ["gpui_authoring/profiler"]
stacker = ["gpui_authoring/stacker"]
font-kit = ["dep:font-kit", "gpui_macos?/font-kit"]

[lib]
path = "src/gpui.rs"
doctest = false

[dependencies]
gpui_authoring.workspace = true
# Not named in this crate's source: the `wayland`, `x11`, and `screen-capture`
# features forward to it. Those features belong to the platform layer, and the
# façade is the only crate that pulls in the platform backends.
gpui_platform.workspace = true
gpui_runtime.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
gpui_web = { workspace = true, optional = true }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
gpui_linux = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
gpui_macos = { workspace = true, optional = true }
# WARNING: If you change this, you must also publish a new version of zed-font-kit to crates.io
font-kit = { git = "https://github.com/zed-industries/font-kit", rev = "94b0f28166665e8fd2f53ff6d268a14955c82269", package = "zed-font-kit", version = "0.14.1-zed", optional = true }

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "windows"))'.dependencies]
scap = { workspace = true, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
gpui_windows = { workspace = true, optional = true }


[dev-dependencies]
anyhow.workspace = true
backtrace.workspace = true
collections = { workspace = true, features = ["test-support"] }
env_logger.workspace = true
gpui_macros.workspace = true
gpui_platform = { workspace = true, features = ["test-support"] }
gpui_util = { workspace = true }
log.workspace = true
lyon = { version = "1.0", features = ["extra"] }
rand.workspace = true
scheduler = { workspace = true, features = ["test-support"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
unicode-segmentation.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
http_client = { workspace = true, features = ["test-support"] }
proptest = { workspace = true }
reqwest_client = { workspace = true, features = ["test-support"] }

[target.'cfg(target_family = "wasm")'.dev-dependencies]
wasm-bindgen = { workspace = true }
web-sys = { version = "0.3", features = ["console"] }

[build-dependencies]
embed-resource = { version = "3.0", optional = true }

[target.'cfg(target_os = "macos")'.build-dependencies]
bindgen = "0.72"

[package.metadata.cargo-shear]
ignored = [
    "bindgen",
    "font-kit",
]

