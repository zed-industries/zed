[package]
name = "npm_backend"
description = "npm package-manager backend — CLI invocation, output parsing, version classification."
license = "Apache-2.0"
edition.workspace = true
version = "0.1.0"
publish = false

[lib]
path = "src/npm_backend.rs"
doctest = false

[dependencies]
ide_env.workspace = true
log.workspace = true
semver.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows-registry.workspace = true