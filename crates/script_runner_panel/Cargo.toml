[package]
name = "script_runner_panel"
description = "Ad-hoc shell command runner panel with live output, built on gpui-component."
license = "Apache-2.0"
edition.workspace = true
version = "0.1.0"
publish = false

[lib]
path = "src/script_runner_panel.rs"
doctest = false

[dependencies]
anyhow.workspace = true
fs.workspace = true
gpui.workspace = true
gpui-component.workspace = true
gpui_util.workspace = true
ide_env.workspace = true
settings.workspace = true
tokio = { workspace = true, features = ["sync"] }
ui.workspace = true
workspace.workspace = true
worktree.workspace = true
