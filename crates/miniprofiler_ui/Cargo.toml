[package]
name = "miniprofiler_ui"
version = "0.1.0"
publish.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/miniprofiler_ui.rs"

[features]
default = ["zed"]
zed = [
    "dep:command_palette_hooks",
    "dep:rpc",
    "dep:settings",
    "dep:workspace",
    "dep:zed_actions",
]

[dependencies]
command_palette_hooks = { workspace = true, optional = true }
gpui.workspace = true
rpc = { workspace = true, optional = true }
settings = { workspace = true, optional = true }
theme_settings.workspace = true
ui.workspace = true
util.workspace = true
serde_json.workspace = true
smol.workspace = true
workspace = { workspace = true, optional = true }
zed_actions = { workspace = true, optional = true }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
