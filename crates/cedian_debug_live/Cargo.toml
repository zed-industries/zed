[package]
name = "cedian_debug_live"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

# Test-only: the Command Line Tools lldb-dap as a Zed debug adapter, for
# S1's live evidence. Kept apart from cedian_panel, whose dev-dependencies
# turn on dap/test-support (every transport becomes fake).

[lints]
workspace = true

[lib]
path = "src/cedian_debug_live.rs"
doctest = false

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
collections.workspace = true
dap.workspace = true
gpui.workspace = true
serde_json.workspace = true
task.workspace = true

[dev-dependencies]
cedian_panel = { path = "../cedian_panel" }
client.workspace = true
clock.workspace = true
command_palette_hooks.workspace = true
debugger_ui.workspace = true
editor.workspace = true
fs.workspace = true
gpui = { workspace = true, features = ["test-support"] }
zlog.workspace = true
http_client = { workspace = true, features = ["test-support"] }
language.workspace = true
node_runtime.workspace = true
project.workspace = true
serde_json.workspace = true
session = { workspace = true, features = ["test-support"] }
settings = { workspace = true, features = ["test-support"] }
theme.workspace = true
theme_settings.workspace = true
workspace.workspace = true
cedian_fake_omp = { path = "../cedian_fake_omp" }
cedian_shell = { path = "../cedian_shell" }

[[test]]
name = "live_turn"
harness = false
