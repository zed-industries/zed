[package]
name = "zed_benchmarks"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/zed_benchmarks.rs"
doctest = false
test = false

# Keep this package free of `test-support`: `script/check-zed-benchmarks-features`
# fails if any crate in this graph enables it.
[dependencies]
activity_indicator.workspace = true
agent.workspace = true
agent-client-protocol.workspace = true
agent_settings.workspace = true
agent_ui.workspace = true
anyhow.workspace = true
assets.workspace = true
breadcrumbs.workspace = true
client.workspace = true
criterion.workspace = true
db.workspace = true
editor.workspace = true
fs.workspace = true
go_to_line.workspace = true
gpui = { workspace = true, features = ["bench-support"] }
gpui_platform = { workspace = true, features = ["bench-support", "font-kit"] }
gpui_tokio.workspace = true
keymap_editor.workspace = true
language.workspace = true
language_model.workspace = true
language_selector.workspace = true
languages = { workspace = true, features = ["load-grammars"] }
log.workspace = true
lsp.workspace = true
menu.workspace = true
node_runtime.workspace = true
paths.workspace = true
project = { workspace = true, features = ["bench-support"] }
project_panel.workspace = true
prompt_store.workspace = true
regex.workspace = true
release_channel.workspace = true
search.workspace = true
semver.workspace = true
serde_json.workspace = true
session.workspace = true
settings.workspace = true
settings_ui.workspace = true
tempfile.workspace = true
theme.workspace = true
theme_settings.workspace = true
ui.workspace = true
util.workspace = true
workspace.workspace = true
zed_actions.workspace = true

[[bench]]
name = "zed_benchmarks"
harness = false
