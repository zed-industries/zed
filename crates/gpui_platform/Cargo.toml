[package]
name = "gpui_platform"
version = "0.1.0"
publish.workspace = true
edition.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[lib]
path = "src/gpui_platform.rs"
doctest = false

[features]
default = []
test-support = ["gpui_backend/test-support"]
bench-support = ["test-support", "gpui_backend/bench-support"]
profiler = []
wayland = []
x11 = ["scap?/x11"]
screen-capture = ["dep:scap"]

[dependencies]
accesskit.workspace = true
anyhow.workspace = true
async-task.workspace = true
chrono.workspace = true
collections.workspace = true
derive_more.workspace = true
etagere.workspace = true
bitflags.workspace = true
futures.workspace = true
gpui_shared_string.workspace = true
gpui_backend.workspace = true
gpui_types.workspace = true
gpui_util.workspace = true
image.workspace = true
log.workspace = true
num_cpus = "1.13"
parking = "2.0.0"
parking_lot.workspace = true
rand.workspace = true
raw-window-handle.workspace = true
scheduler.workspace = true
schemars.workspace = true
seahash = "4.1"
serde.workspace = true
serde_json.workspace = true
slotmap.workspace = true
smallvec.workspace = true
strum.workspace = true
thiserror.workspace = true
uuid.workspace = true
waker-fn = "1.2.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "windows"))'.dependencies]
scap = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-video.workspace = true
