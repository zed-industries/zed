[package]
name = "scheduler"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[lib]
path = "src/scheduler.rs"
doctest = false

[features]
test-support = []
# Makes the scheduler safe to use from multiple web workers. Enable it when
# the platform spawns dedicated threads as workers on wasm.
#
# `flume/spin` replaces flume's internal `std::sync::Mutex` with a spinlock:
# a contended `std` lock parks with `Atomics.wait`, which the browser forbids
# on the main thread, and the main thread sends on flume channels every time
# it schedules work onto a dedicated thread.
wasm-threads = ["flume/spin"]

[dependencies]
async-task.workspace = true
backtrace.workspace = true
chrono = { workspace = true, features = ["now", "wasmbind"] }
flume.workspace = true
futures.workspace = true
parking_lot.workspace = true
rand.workspace = true
web-time.workspace = true
