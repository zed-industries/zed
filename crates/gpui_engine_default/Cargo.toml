[package]
name = "gpui_engine_default"
version = "0.1.0"
publish.workspace = true
edition.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[lib]
path = "src/gpui_engine_default.rs"
doctest = false

[features]
default = []
stacker = ["dep:stacksafe"]
test-support = ["gpui_engine/test-support", "gpui_types/test-support"]
bench-support = ["test-support", "gpui_engine/bench-support"]

[dependencies]
anyhow.workspace = true
collections.workspace = true
gpui_engine.workspace = true
gpui_shared_string.workspace = true
gpui_types.workspace = true
itertools.workspace = true
parking_lot.workspace = true
smallvec.workspace = true
stacksafe = { workspace = true, optional = true }
taffy = "=0.13.0"
