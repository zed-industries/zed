[package]
name = "sandbox_linux"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/sandbox_linux.rs"
doctest = false

[[test]]
name = "end_to_end"
path = "tests/end_to_end.rs"
# The sandbox re-executes the current binary as its supervisor and helper, so
# the test needs its own `main` that dispatches those entrypoints first.
harness = false

[target.'cfg(target_os = "linux")'.dependencies]
anyhow.workspace = true
libc.workspace = true
log.workspace = true
nix = { workspace = true, features = ["socket", "uio"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
tempfile.workspace = true
