[package]
name = "mermaid_render"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/mermaid_render.rs"
doctest = false

[features]
test-support = []

[dependencies]
anyhow.workspace = true
gpui.workspace = true
merman = { workspace = true, features = [
    # Keep in sync with the `SUPPORTED_PREFIXES` in crates/markdown/src/mermaid.rs.
    "diagram-class",
    "diagram-er",
    "diagram-flowchart",
    "diagram-gantt",
    "diagram-git-graph",
    "diagram-journey",
    "diagram-mindmap",
    "diagram-pie",
    "diagram-quadrant-chart",
    "diagram-sequence",
    "diagram-state",
    "diagram-timeline",
    "diagram-xychart",
    "layout-cytoscape",
    "svg",
] }
quick-xml.workspace = true
serde_json.workspace = true
tracing.workspace = true
ztracing.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
mermaid_render = { workspace = true, features = ["test-support"] }
usvg.workspace = true

[package.metadata.cargo-shear]
ignored = ["tracing"]
