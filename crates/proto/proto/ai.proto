syntax = "proto3";
package zed.messages;

import "task.proto";

message GetAgentServerCommand {
  uint64 project_id = 1;
  string name = 2;
  optional string root_dir = 3;
}

message GetContextServerCommand {
  uint64 project_id = 1;
  string server_id = 2;
  optional string root_dir = 3;
}

message ContextServerCommand {
  string path = 1;
  repeated string args = 2;
  map<string, string> env = 3;
}

message AgentServerCommand {
  string path = 1;
  repeated string args = 2;
  map<string, string> env = 3;
  string root_dir = 4;

  optional SpawnInTerminal login = 5;
}

message GetGlobalSkills {
  uint64 project_id = 1;
}

message GetGlobalSkillsResponse {
  repeated GlobalSkillFile files = 1;
  repeated GlobalSkillLoadError errors = 2;
}

message GlobalSkillFile {
  string path = 1;
  string content = 2;
}

message GlobalSkillLoadError {
  string path = 1;
  string message = 2;
}

message GlobalSkillsChanged {
  uint64 project_id = 1;
}

message CreateGlobalSkill {
  uint64 project_id = 1;
  string name = 2;
  string description = 3;
  string body = 4;
  bool disable_model_invocation = 5;
}

message CreateGlobalSkillResponse {
  string skill_file_path = 1;
}

message TrashGlobalSkill {
  uint64 project_id = 1;
  string directory_name = 2;
}

message ExternalAgentsUpdated {
  uint64 project_id = 1;
  repeated string names = 2;
}

message ExternalExtensionAgentTarget {
  string archive = 1;
  string cmd = 2;
  repeated string args = 3;
  optional string sha256 = 4;
  map<string, string> env = 5;
}

message ExternalExtensionAgent {
  string name = 1;
  optional string icon_path = 2;
  string extension_id = 3;
  map<string, ExternalExtensionAgentTarget> targets = 4;
  map<string, string> env = 5;
  optional string version = 6;
}

message ExternalExtensionAgentsUpdated {
  uint64 project_id = 1;
  repeated ExternalExtensionAgent agents = 2;
}

message ExternalAgentLoadingStatusUpdated {
  uint64 project_id = 1;
  string name = 2;
  reserved 3;
  optional string status = 4;
}

message NewExternalAgentVersionAvailable {
  uint64 project_id = 1;
  string name = 2;
  string version = 3;
}
