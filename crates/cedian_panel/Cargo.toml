[package]
name = "cedian_panel"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

# S9a spike: cedian's headless crates are path deps on the cedian repo
# (sibling checkout at ~/cedian). Final layout is an ADR finding of S9a.

[lints]
workspace = true

[lib]
path = "src/cedian_panel.rs"
doctest = false

[features]
test-support = []

[dependencies]
anyhow.workspace = true
base64.workspace = true
libc.workspace = true
cedian_agent = { path = "../cedian_agent" }
cedian_agent_ui = { path = "../cedian_agent_ui" }
cedian_omp = { path = "../cedian_omp" }
cedian_review = { path = "../cedian_review" }
cedian_shell = { path = "../cedian_shell" }
cedian_worker = { path = "../cedian_worker" }
cedian_workflow = { path = "../cedian_workflow" }
cedian_workspace = { path = "../cedian_workspace" }
clock.workspace = true
collections.workspace = true
editor.workspace = true
fs.workspace = true
futures.workspace = true
gpui = { workspace = true, features = ["profiler"] }
url.workspace = true
language.workspace = true
log.workspace = true
omp-rpc = { path = "../../vendor/omp-rpc" }
parking_lot.workspace = true
project.workspace = true
rand.workspace = true
serde_json.workspace = true
text.workspace = true
tungstenite = "0.26"
ui.workspace = true
util.workspace = true
workspace.workspace = true
worktree.workspace = true

[dev-dependencies]
cedian_panel = { path = ".", features = ["test-support"] }
cedian_fake_omp = { path = "../cedian_fake_omp" }
fs = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
hdrhistogram.workspace = true
language = { workspace = true, features = ["test-support"] }
lsp = { workspace = true, features = ["test-support"] }
project = { workspace = true, features = ["test-support"] }
serde_json.workspace = true
settings = { workspace = true, features = ["test-support"] }
theme.workspace = true
theme_settings.workspace = true
tungstenite = "0.26"
workspace = { workspace = true, features = ["test-support"] }

[[test]]
name = "app_shell"
harness = false

[[test]]
name = "settings_page"
harness = false

[[test]]
name = "agent_loop"
harness = false

[[test]]
name = "one_driver"
harness = false

[[test]]
name = "live_approval"
harness = false

[[test]]
name = "turn_lifecycle"
harness = false

[[test]]
name = "stop_and_send"
harness = false

[[test]]
name = "context"
harness = false

[[test]]
name = "browser"
harness = false

[[test]]
name = "subagents"
harness = false

[[test]]
name = "worker_trees"
harness = false

[[test]]
name = "workflow"
harness = false

[[test]]
name = "review"
harness = false

[[test]]
name = "inline_edit"
harness = false

[[test]]
name = "parity_core"
harness = false
