[package]
name = "cli"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/cli.rs"
doctest = false

[[bin]]
name = "cli"
path = "src/main.rs"

[features]
# Kept for compatibility with packaging scripts that pass this feature when
# building the workspace; the flag now only affects the `zed` crate.
no-bundled-uninstall = []
default = []

[dependencies]
anyhow.workspace = true
collections.workspace = true
ipc-channel = "0.19"
serde.workspace = true

[build-dependencies]
windows_resources = { path = "../windows_resources" }
