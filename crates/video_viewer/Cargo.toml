[package]
name = "video_viewer"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/video_viewer.rs"
doctest = false

[dependencies]
anyhow.workspace = true
db.workspace = true
editor.workspace = true
file_icons.workspace = true
gpui.workspace = true
language.workspace = true
log.workspace = true
project.workspace = true
settings.workspace = true
theme_settings.workspace = true
ui.workspace = true
util.workspace = true
workspace.workspace = true
worktree.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-av-foundation = { workspace = true, features = [
    "AVAsset",
    "AVAssetTrack",
    "AVMediaFormat",
    "AVPlayer",
    "AVPlayerItem",
    "AVPlayerItemOutput",
    "AVVideoComposition",
    "AVVideoSettings",
    "objc2-core-foundation",
    "objc2-core-media",
    "objc2-core-video",
    "std",
] }
objc2-core-foundation = { workspace = true, features = ["CFCGTypes", "CFString"] }
objc2-core-media = { workspace = true, features = ["CMTime"] }
objc2-core-video = { workspace = true, features = ["CVPixelBuffer"] }
objc2-foundation.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
image.workspace = true
smallvec.workspace = true
url.workspace = true
windows = { workspace = true, features = [
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_MediaFoundation",
] }
windows-core.workspace = true

[dev-dependencies]
db = { workspace = true, features = ["test-support"] }
editor = { workspace = true, features = ["test-support"] }
fs.workspace = true
theme.workspace = true
