[workspace]

[package]
name = "hello_web"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "hello-web"
path = "main.rs"

[[bin]]
name = "hello-world"
path = "../../../gpui/examples/hello_world.rs"

[[bin]]
name = "text"
path = "../../../gpui/examples/text.rs"

[[bin]]
name = "text-layout"
path = "../../../gpui/examples/text_layout.rs"

[[bin]]
name = "text-wrapper"
path = "../../../gpui/examples/text_wrapper.rs"

[[bin]]
name = "input"
path = "../../../gpui/examples/input.rs"

[[bin]]
name = "font-fallback-test"
path = "font_fallback_test.rs"

[[bin]]
name = "queue-test"
path = "queue_test.rs"

[[bin]]
name = "dynamic-fonts"
path = "dynamic_fonts.rs"

[[bin]]
name = "http-client-test"
path = "http_client_test.rs"

[dependencies]
anyhow = "1"
futures = "0.3"
gpui = { path = "../../../gpui" }
gpui_platform = { path = "../../../gpui_platform" }
gpui_util = { path = "../../../gpui_util" }
gpui_web = { path = "../.." }
http_client = { path = "../../../http_client" }
unicode-segmentation = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wasm_thread = { git = "https://github.com/zed-industries/wasm_thread", rev = "0cf96c7708dfb97ccf3da50347e25edcf75d6937", features = ["es_modules"] }
web-sys = { version = "0.3", features = ["console", "Location", "Window"] }
web-time = "1"
