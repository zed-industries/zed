corgi_version = "0.1.107"

# corgi build configuration for Zed.
# Corgi source and documentation: https://github.com/ConradIrwin/corgi
#
# corgi runs build.rs scripts and proc-macros in a sandbox with no network,
# no ambient environment, and reads limited to each package's own source plus
# what is declared here. Every setting names the packages it applies to, so
# only those packages' actions key on it — comment or command-text edits
# rebuild nothing.
#
# See the top-level Cargo.toml `[patch.crates-io]` for the local `scratch` patch
# that lets cxx/webrtc-sys build under the sandbox, and `util::fs_embed!` for
# how dev builds read embedded assets from the checkout instead of baking the
# build path into the binary.

# sha256-pinned tools, fetched into the corgi store and exposed to the named
# packages' build scripts via the given environment variable. Each download is
# built for one platform, so `targets` limits a tool to builds for that
# platform.
#
# Note: no protoc tool is needed. `proto` and `livekit_api` compile their
# protobufs with `protox` (a pure-Rust protoc) and `prost_build::compile_fds`,
# so nothing shells out to a protoc binary.

[tools.cmake]
version = "4.1.2"
url = "https://github.com/Kitware/CMake/releases/download/v4.1.2/cmake-4.1.2-macos-universal.tar.gz"
sha256 = "3be85f5b999e327b1ac7d804cbc9acd767059e9f603c42ec2765f6ab68fbd367"
bin = "cmake-4.1.2-macos-universal/CMake.app/Contents/bin/cmake"
env = "CMAKE"
packages = ["webrtc-sys", "wasmtime-c-api-impl"]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]

[tools.cmake-linux-x86_64]
version = "4.1.2"
url = "https://github.com/Kitware/CMake/releases/download/v4.1.2/cmake-4.1.2-linux-x86_64.tar.gz"
sha256 = "773cc679c3a7395413bd096523f8e5d6c39f8718af4e12eb4e4195f72f35e4ab"
bin = "cmake-4.1.2-linux-x86_64/bin/cmake"
command = "cmake"
env = "CMAKE"
packages = ["webrtc-sys", "wasmtime-c-api-impl"]
targets = ["x86_64-unknown-linux-gnu"]

# Prebuilt libwebrtc, so webrtc-sys-build does not have to download it over the
# network (which the sandbox forbids). The tag must match WEBRTC_TAG in the
# pinned livekit-rust-sdks revision; webrtc-sys-build reads LK_CUSTOM_WEBRTC and
# skips the download when it is set.
[tools.webrtc-prebuilt]
version = "0001d84-4"
url = "https://github.com/zed-industries/livekit-rust-sdks/releases/download/webrtc-0001d84-4/webrtc-mac-arm64-release.zip"
sha256 = "09ba71bfbc15c6aacced7fe20451a9648dfe648c24295f28d75fc386dbd7281a"
path = "mac-arm64-release"
env = "LK_CUSTOM_WEBRTC"
packages = ["webrtc-sys"]
targets = ["aarch64-apple-darwin"]

[tools.webrtc-prebuilt-linux-x86_64]
version = "0001d84-4"
url = "https://github.com/zed-industries/livekit-rust-sdks/releases/download/webrtc-0001d84-4/webrtc-linux-x64-release.zip"
sha256 = "23dd88d485b85e709b3fa37d7afed5ca7a3dd05febd3d9383ebeb793bcd1039e"
path = "linux-x64-release"
env = "LK_CUSTOM_WEBRTC"
packages = ["webrtc-sys"]
targets = ["x86_64-unknown-linux-gnu"]

# Shared libraries the Linux build links against when corgi supplies its own
# Zig toolchain, as on FHS Linux. Corgi unpacks them into a per-target sysroot
# that its pkg-config and linker read from; nothing comes from the host, so
# installing distribution -dev packages does not help. Each library needs its
# -dev package (the .so link, headers and .pc file) and its runtime package
# (the real .so). They come from Debian bullseye, whose glibc 2.31 is older
# than Corgi's default glibc 2.35 target. A Nix dev shell supplies its own
# compiler and pkg-config, so these are not used there.
#
# alsa: alsa-sys; fontconfig: yeslogic-fontconfig-sys; freetype: required by
# fontconfig.pc; x11 (and x11proto for xproto.pc and kbproto.pc): x11;
# x11-xcb: the x11 crate's xlib_xcb feature;
# glib (glib, gobject, gio): glib-sys, gobject-sys, gio-sys and webrtc-sys;
# xkbcommon, xkbcommon-x11: xkbcommon; xcb: x11rb.

[libraries.libasound2-dev-amd64]
# libasound2-dev 1.2.4-1.1 (Debian bullseye)
url = "https://snapshot.debian.org/archive/debian/20250601T000000Z/pool/main/a/alsa-lib/libasound2-dev_1.2.4-1.1_amd64.deb"
