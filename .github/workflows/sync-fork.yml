# Daily fork sync: merges upstream zed-industries/zed main into this fork's main.
# Builds are triggered from this workflow's completion by build-binaries.yml.
name: sync-fork

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-fork
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
          ref: main
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Add upstream
        run: git remote add upstream https://github.com/zed-industries/zed.git
      - name: Fetch upstream
        run: git fetch upstream main
      - name: Merge upstream main
        run: |
          git checkout main
          if git merge --ff-only upstream/main 2>/dev/null; then
            # Also reached when main is already up to date with upstream.
            echo "::notice::main synced with upstream/main"
            exit 0
          fi

          # Cargo.lock is intentionally kept on a newer cxx release for the
          # fork's macOS toolchain. Rebase it onto upstream, then reapply that
          # one fork-specific dependency update.
          if git merge upstream/main -m "Merge upstream main"; then
            echo "::notice::merged upstream/main into main"
            exit 0
          fi

          conflicts=$(git diff --name-only --diff-filter=U)
          if [ "$conflicts" != "Cargo.lock" ]; then
            echo "::error::upstream merge has unsupported conflicts: $conflicts"
            git merge --abort
            exit 1
          fi

          git checkout --theirs Cargo.lock
          cargo update -p cxx --precise 1.0.198
          git add Cargo.lock
          git commit --no-edit
          echo "::notice::merged upstream/main and refreshed Cargo.lock"
      - name: Push
        run: git push origin main