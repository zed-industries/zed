# Sync GitHub project #87 to the current second-line triage shift's issues

name: Issue Triage Queue Board

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Log the diff without mutating the board"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: triage-queue-board
  cancel-in-progress: true

jobs:
  sync:
    name: Sync triage queue board
    if: github.repository == 'zed-industries/zed'
    runs-on: namespace-profile-2x4-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        with:
          app-id: ${{ secrets.ZED_COMMUNITY_BOT_APP_ID }}
          private-key: ${{ secrets.ZED_COMMUNITY_BOT_PRIVATE_KEY }}
          owner: zed-industries
          repositories: zed
          permission-issues: read
          permission-organization-projects: write

      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          sparse-checkout: |
            script/github-triage-queue-board.py
            script/github_helpers.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Sync
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          PROJECT_NUMBER: "87"
          DRY_RUN: ${{ inputs.dry_run }}
        run: python script/github-triage-queue-board.py
