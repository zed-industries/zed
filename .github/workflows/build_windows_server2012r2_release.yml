name: build-windows-server2012r2-release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build
        required: true
        type: string
        default: main

permissions:
  contents: write

jobs:
  build-server2012r2:
    name: Build Windows Server 2012 R2 artifact
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      WINVER: 0x0603
      _WIN32_WINNT: 0x0603
      RUSTFLAGS: -C link-arg=/SUBSYSTEM:WINDOWS,6.03

    steps:
      - name: Validate branch exists
        shell: pwsh
        run: |
          $branch = "${{ github.event.inputs.branch || github.ref_name }}"
          if ([string]::IsNullOrWhiteSpace($branch)) {
            throw "Branch input is required."
          }

          $branches = git ls-remote --heads origin | ForEach-Object {
            $_.Split(" ")[1] -replace "^refs/heads/", ""
          }

          if ($branches -notcontains $branch) {
            throw "Branch '$branch' not found in origin. Available branches: $($branches | Sort-Object | Select-Object -First 20 -join ', ')"
          }

          "BUILD_BRANCH=$branch" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_BRANCH }}
          fetch-depth: 0
          clean: false

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Configure cargo for Windows Server 2012 R2 compatibility
        shell: pwsh
        run: |
          $cargoDir = Join-Path $env:USERPROFILE ".cargo"
          New-Item -ItemType Directory -Path $cargoDir -Force | Out-Null
          $config = @"
          [target.x86_64-pc-windows-msvc]
          rustflags = ["-C", "link-arg=/SUBSYSTEM:WINDOWS,6.03"]
          "@
          Set-Content -Path (Join-Path $cargoDir "config.toml") -Value $config -Encoding UTF8

      - name: Clean target dir if needed
        shell: pwsh
        run: ./script/clear-target-dir-if-larger-than.ps1 350 200

      - name: Build Windows bundle
        shell: pwsh
        run: |
          ./script/bundle-windows.ps1 -Architecture x86_64

      - name: Verify expected artifacts exist
        shell: pwsh
        run: |
          $files = @(
            "target/Zed-x86_64.exe",
            "target/zed-remote-server-windows-x86_64.zip"
          )

          foreach ($f in $files) {
            if (-not (Test-Path $f)) {
              throw "Missing expected artifact: $f"
            }
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zed-windows-server2012r2-x86_64
          path: |
            target/Zed-x86_64.exe
            target/zed-remote-server-windows-x86_64.zip
          if-no-files-found: error
