# Builds the Windows bundle after a direct push to main, a successful fork sync,
# or a manual dispatch, then publishes a GitHub release on this fork.
# The built binary's auto-update (crates/auto_update) picks up the new version.
name: build-binaries

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build
        required: false
        default: main
  # sync-fork uses GITHUB_TOKEN, so its main push is covered by workflow_run.
  workflow_run:
    workflows: [sync-fork]
    types: [completed]

permissions:
  contents: write
env:
  # auto_update.rs reads this at compile time, so fork-built binaries query
  # this repository's GitHub releases instead of zed.dev.
  ZED_FORK_REPO: ${{ github.repository }}


concurrency:
  group: build-binaries
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      skip: ${{ steps.compute.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.ref }}
      - name: Compute release version
        id: compute
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Skip the build when the source commit already has a release (e.g. a
          # no-op sync where upstream did not change), instead of publishing an
          # identical binary under a bumped version every day.
          if gh release list --limit 50 --json body --jq \
            'any(.[]; .body | contains("commit: '"$GITHUB_SHA"'"))' | grep -q true; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Source commit $GITHUB_SHA already built; skipping."
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          upstream_version=$(grep '^version' crates/zed/Cargo.toml | head -1 | sed -E 's/^version = "([^"]+)".*/\1/')
          latest_tag=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)
          version=$(python3 - "$upstream_version" "$latest_tag" <<'EOF'
          import re
          import sys

          def parse(value):
              match = re.fullmatch(r"v?(\d+)\.(\d+)\.(\d+)", value or "")
              if not match:
                  return None
              return tuple(int(part) for part in match.groups())

          upstream = parse(sys.argv[1])
          latest = parse(sys.argv[2])
          if latest is None or latest < upstream:
              print(f"{upstream[0]}.{upstream[1]}.{upstream[2]}")
          else:
              print(f"{latest[0]}.{latest[1]}.{latest[2] + 1}")
          EOF
          )
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building version $version (upstream $upstream_version, latest release $latest_tag)"


  build-windows:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true' && (github.event_name != 'workflow_dispatch' || inputs.branch == 'main')
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      ZED_WORKSPACE: ${{ github.workspace }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      ZED_RELEASE_CHANNEL: stable
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.ref }}
      - name: Set release version
        shell: bash
        run: |
          sed -i "s/^version = \"[^\"]*\"/version = \"${{ needs.prepare.outputs.version }}\"/" crates/zed/Cargo.toml
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@72d126e709cad40056a62344eee609d696d62d33
      - name: Enable long paths
        shell: pwsh
        run: |
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\FileSystem" /v LongPathsEnabled /t REG_DWORD /d 1 /f
          git config --global core.longpaths true
      - name: Fetch dependencies
        shell: bash
        run: cargo fetch
      - name: Bundle Windows installer
        shell: pwsh
        run: ./script/bundle-windows.ps1
      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-assets
          path: |
            target/Zed-x86_64.exe
            target/zed-remote-server-windows-x86_64.zip

  release:
    needs: [prepare, build-windows]
    if: needs.prepare.outputs.skip != 'true' && (github.event_name != 'workflow_dispatch' || inputs.branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: assets
          merge-multiple: true
      - name: Rename Windows assets to update-schema names
        run: |
          exe=$(find assets -name 'Zed-*.exe' | head -1)
          mv "$exe" assets/zed-windows-x86_64.exe
          ls -la assets/
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$VERSION" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Zed $VERSION" \
            --notes "Auto-built from hee10k/zed. Install and run 'zed update' to receive future builds.
            commit: $COMMIT_SHA" \
            $(find assets -type f)