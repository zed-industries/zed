[package]
name = "crates_io_client"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/crates_io_client.rs"
doctest = false

[dependencies]
anyhow.workspace = true
chrono.workspace = true
progenitor = "0.15.0"
# The code generated by progenitor refers to `reqwest` directly, so this must
# match the version `progenitor-client` depends on.
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "rustls", "stream"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
