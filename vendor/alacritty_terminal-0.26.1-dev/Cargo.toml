[package]
edition = "2024"
rust-version = "1.85.0"
name = "alacritty_terminal"
version = "0.26.1-dev"
authors = [
    "Christian Duerr <contact@christianduerr.com>",
    "Joe Wilm <joe@jwilm.com>",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Library for writing terminal emulators"
homepage = "https://alacritty.org"
readme = "../README.md"
license = "Apache-2.0"
repository = "https://github.com/alacritty/alacritty"

[features]
default = ["serde"]
serde = [
    "dep:serde",
    "bitflags/serde",
    "vte/serde",
]

[lib]
name = "alacritty_terminal"
path = "src/lib.rs"

[[test]]
name = "ref"
path = "tests/ref.rs"

[dependencies]
base64 = "0.22.0"
bitflags = "2.4.1"
home = "0.5.5"
log = "0.4"
parking_lot = "0.12.0"
polling = "3.8.0"
regex-automata = "0.4.3"
unicode-width = "0.2.0"

[dependencies.libc]
version = "0.2"
features = ["extra_traits"]

[dependencies.serde]
version = "1"
features = [
    "derive",
    "rc",
]
optional = true

[dependencies.vte]
version = "0.15.0"
