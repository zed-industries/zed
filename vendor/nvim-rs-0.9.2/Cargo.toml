[package]
edition = "2021"
name = "nvim-rs"
version = "0.9.2"
authors = ["KillTheMule <KillTheMule@users.noreply.github.com"]
build = "build.rs"
exclude = [
    "neovim/*",
    ".travis.yml",
    "appveyor.yml",
    ".git",
    ".gitignore",
    ".gitmodules",
    "build.ps1",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A library for writing neovim rpc clients"
readme = "README.md"
keywords = [
    "neovim",
    "nvim",
    "rpc",
    "msgpack",
]
categories = ["api-bindings"]
license = "LGPL-3.0"
repository = "https://github.com/KillTheMule/nvim-rs"

[package.metadata.docs.rs]
